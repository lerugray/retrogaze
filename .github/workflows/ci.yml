name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Code mode renders art with the vendored pxl (third_party/pxl), which needs Node >= 22.18.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        env:
          RETROGAZE_MOCK: 1
        run: |
          cd src
          python -m pytest tests/ -v

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      RETROGAZE_TEST_EMAIL: ${{ secrets.RETROGAZE_TEST_EMAIL }}
      RETROGAZE_TEST_PASSWORD: ${{ secrets.RETROGAZE_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # The live-site smoke needs a dedicated test account. Until those repo
      # secrets exist, skip cleanly instead of failing every push.
      - name: Check e2e credentials
        id: creds
        run: |
          if [ -n "$RETROGAZE_TEST_EMAIL" ] && [ -n "$RETROGAZE_TEST_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::e2e smoke skipped - RETROGAZE_TEST_EMAIL/RETROGAZE_TEST_PASSWORD secrets not configured"
          fi
      - name: Set up Node.js
        if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install e2e dependencies
        if: steps.creds.outputs.present == 'true'
        run: |
          cd tests/e2e
          npm install
      - name: Install Playwright browsers
        if: steps.creds.outputs.present == 'true'
        run: |
          cd tests/e2e
          npm run install-browsers
      - name: Run e2e smoke tests
        if: steps.creds.outputs.present == 'true'
        run: |
          cd tests/e2e
          npm run smoke
