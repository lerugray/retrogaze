# ld65 config for the Retrogaze NES proof viewer on an MMC1 cartridge with CHR-RAM (mapper 1).
# Output = 16-byte iNES header + 8 x 16 KiB PRG banks (128 KiB) and no CHR-ROM (8 KiB CHR-RAM).
# PRG mode 3: banks 0-6 switch in at $8000, bank 7 is fixed at $C000. Banks 0-6 are linked at
# $8000; their reset stub runs at $FFF0 when the cartridge powers on with that bank at $C000, and
# it is position independent, so the link address does not matter for it.
MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, file = "";
    HDR:   start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;
    PRG0:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG4:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG5:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG6:  start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG7:  start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = HDR,  type = ro;
    BANK0:    load = PRG0, type = ro, start = $8000;
    STUB0:    load = PRG0, type = ro, start = $BFF0;
    STUB1:    load = PRG1, type = ro, start = $BFF0;
    STUB2:    load = PRG2, type = ro, start = $BFF0;
    STUB3:    load = PRG3, type = ro, start = $BFF0;
    STUB4:    load = PRG4, type = ro, start = $BFF0;
    STUB5:    load = PRG5, type = ro, start = $BFF0;
    STUB6:    load = PRG6, type = ro, start = $BFF0;
    CODE:     load = PRG7, type = ro, start = $C000;
    RODATA:   load = PRG7, type = ro;
    STUB7:    load = PRG7, type = ro, start = $FFF0;
}
