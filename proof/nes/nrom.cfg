# ld65 config for the Retrogaze NES proof viewer: NROM-128 (mapper 0).
# Output = 16-byte iNES header + 16 KiB PRG (at $C000, mirrored at $8000) + 8 KiB CHR-ROM.
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, file = "";
    HDR:  start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $00;
    PRG:  start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:  start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = HDR, type = ro;
    CODE:     load = PRG, type = ro, start = $C000;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
    CHARS:    load = CHR, type = ro;
}
