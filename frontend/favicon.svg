<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="16" height="16" fill="#0C0C0C"/>
  <!-- 8x8 grid lines (subtle) -->
  <line x1="8" y1="0" x2="8" y2="16" stroke="#1A1A2E" stroke-width="1"/>
  <line x1="0" y1="8" x2="16" y2="8" stroke="#1A1A2E" stroke-width="1"/>
  <!-- Pixel art "R" glyph in NES orange, top-left tile -->
  <rect x="1" y="1" width="5" height="1" fill="#F83800"/>
  <rect x="1" y="2" width="1" height="5" fill="#F83800"/>
  <rect x="6" y="2" width="1" height="2" fill="#F83800"/>
  <rect x="1" y="4" width="5" height="1" fill="#F83800"/>
  <rect x="5" y="5" width="2" height="2" fill="#F83800"/>
  <!-- Pixel dot in bottom-right tile (NES blue accent) -->
  <rect x="10" y="10" width="4" height="4" fill="#6888FC"/>
  <rect x="11" y="11" width="2" height="2" fill="#0C0C0C"/>
  <!-- Small accent pixel top-right -->
  <rect x="11" y="2" width="2" height="2" fill="#00A800"/>
  <!-- Small accent pixel bottom-left -->
  <rect x="2" y="11" width="2" height="2" fill="#F83800" opacity="0.6"/>
</svg>
